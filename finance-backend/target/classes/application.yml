spring:
  application:
    name: finance-api
  
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:default_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

app:
  jwtSecret: ${JWT_SECRET}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

logging:
  level:
    com.finance.api: DEBUG
    org.hibernate.SQL: DEBUG
